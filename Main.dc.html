argin-bottom: 22px;\"><span>(05)<\u002Fspan> OUR PROCESS<\u002Fdiv>\n        <h2 class=\"nx-h2\"><span class=\"nx-mask\"><span>How a project<\u002Fspan><\u002Fspan> <span class=\"nx-mask\"><span>runs<\u002Fspan><\u002Fspan><\u002Fh2>\n        <p style=\"color: #8D96A8; font-size: 16px; line-height: 1.65; margin: 22px 0 0; max-width: 360px;\">Four simple steps, so you always know where things stand.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 999 1 520px; min-width: 0; position: relative; padding-left: 48px;\">\n      <div aria-hidden=\"true\" style=\"position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: #1C212C;\"><div class=\"nx-proc-fill\"><\u002Fdiv><\u002Fdiv>\n      \n        <div class=\"nx-step\" data-step=\"\">\n          <span class=\"nx-step-dot\" aria-hidden=\"true\"><\u002Fspan>\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 14px;\">STEP {{item.num}}<\u002Fdiv>\n          <h3 style=\"font-family: 'Sora', sans-serif; font-weight: 600; font-size: clamp(24px, 2.4vw, 34px); letter-spacing: -0.02em; margin: 0 0 12px; color: #F3F5F8;\">{{item.title}}<\u002Fh3>\n          <p style=\"color: #8D96A8; font-size: 16px; line-height: 1.65; margin: 0; max-width: 520px;\">{{item.desc}}<\u002Fp>\n        <\u002Fdiv>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  \n  <div class=\"nx-cta\" data-nx-cta=\"\" style=\"position: relative; overflow: hidden; border-top: 1px solid rgba(255,255,255,0.07); background: #03050A;\">\n    <img class=\"nx-cta-img\" src=\"b66273ec-b50e-425a-9050-1dcee10ae78d\" width=\"960\" height=\"540\" alt=\"\" aria-hidden=\"true\" loading=\"lazy\" decoding=\"async\">\n    <div aria-hidden=\"true\" style=\"position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(3,5,10,0.35), #03050A 78%);\"><\u002Fdiv>\n    <div class=\"nx-reveal nx-sec\" style=\"position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 170px 48px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 30px;\">\n      <div class=\"nx-label\"><span>(06)<\u002Fspan> START A PROJECT<\u002Fdiv>\n      <h2 class=\"nx-h2\" style=\"font-size: clamp(40px, 6.4vw, 96px); line-height: 0.98;\"><span class=\"nx-mask\"><span>Let's build what's<\u002Fspan><\u002Fspan> <span class=\"nx-mask\"><span><em class=\"nx-grad-text\" style=\"font-style: normal;\">next<\u002Fem> for your business.<\u002Fspan><\u002Fspan><\u002Fh2>\n      <p style=\"color: #AEB6C6; font-size: 17px; line-height: 1.6; margin: 0; max-width: 520px;\">Tell us about your project and we'll follow up to talk through the details.<\u002Fp>\n      <a href=\"About.dc.html#contact\" class=\"nx-btn-primary nx-magnet\" data-magnet=\"\" style=\"background: var(--accent); color: #06080C; font-weight: 600; font-size: 16px; padding: 20px 38px; border-radius: 100px; margin-top: 8px;\">Start a Project<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <dc-import name=\"Footer\" hint-size=\"100%,440px\"><\u002Fdc-import>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3A74FF&quot;,&quot;options&quot;:[&quot;#3A74FF&quot;,&quot;#5A8CFF&quot;,&quot;#22D3EE&quot;,&quot;#A855F7&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8600}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (typeof window === 'undefined') return;\n    this._off = [];\n    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    this.reduce = reduce;\n    this.setupReveal();\n    const heroEl = document.querySelector('[data-nxh]');\n    if (reduce) {\n      document.querySelectorAll('.nx-word').forEach((w) => w.classList.add('nx-on'));\n      document.querySelectorAll('[data-step]').forEac
